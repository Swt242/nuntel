[package]
name = "rgui-todo"
version = "0.1.0"
edition = "2024"

[dependencies]
chinese_holiday = "2026.0.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
lunar-lite = "1.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = "1.18.0"
tauri-winrt-notification = "0.8.1"
tray-icon = "0.25.1"
# OpenAI 兼容对话用的 HTTP 客户端。**故意选同步阻塞的**:本应用没有 async runtime
# (全程靠 Slint 的 Timer + channel 驱动),流式读取丢到一个后台线程里跑,
# 增量通过 channel 送回主线程就行,不值得为这个引 tokio。
# TLS 走 native-tls → Windows 上是系统 schannel,顺带吃企业环境的自签证书,
# 也不用往 exe 里塞一份根证书。
ureq = { version = "3.4", default-features = false, features = ["native-tls", "json", "gzip"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[features]
# 用 Skia 渲染器:文字比默认的 femtovg 锐不少(实测边缘强度 4.70 vs 3.46)。
# Skia 是从预编译包拉的,需要 MSVC 工具链 —— GNU 工具链下编不过。
# 用法: cargo build --release --features skia
skia = ["slint/renderer-skia"]

[build-dependencies]
slint-build = "1.18.0"
# build.rs 要读 assets/pet/manifest.json 来生成帧表
serde_json = "1.0.151"
